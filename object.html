<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Object — The Manufactured Face</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:    #0e0d0b;
      --ink:   #e8e2d8;
      --dim:   #5a5650;
      --rule:  #272420;
      --bar:   #e8e2d8;
      --font:  'ABC Monument Grotesk Mono Unlicensed Trial', 'IBM Plex Mono', monospace;
    }

    html, body { background: var(--bg); color: var(--ink); font-family: var(--font); height: 100%; text-transform: uppercase; }

    /* ── Header ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      background: var(--bg);
      border-bottom: 1px solid var(--rule);
      display: flex;
      align-items: center;
      padding: 0 40px;
      height: 48px;
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .h-title  { font-weight: 400; }
    .h-spacer { flex: 1; }
    .h-label  { color: var(--dim); font-size: 9px; letter-spacing: 0.12em; }
    .h-back a {
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
      transition: border-color 0.2s;
    }
    .h-back a:hover { border-color: var(--ink); }

    /* ── Two-panel layout ── */
    #obj-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      height: 100vh;
      padding-top: 48px;
    }

    /* ── Image panel ── */
    #obj-image {
      position: sticky;
      top: 48px;
      height: calc(100vh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 52px;
      border-right: 1px solid var(--rule);
      overflow: hidden;
    }
    #obj-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* ── Meta panel ── */
    #obj-meta {
      height: calc(100vh - 48px);
      overflow-y: auto;
      padding: 48px 40px 40px;
      display: flex;
      flex-direction: column;
    }

    /* Large sequence number */
    #obj-num {
      font-size: 76px;
      font-weight: 300;
      font-style: italic;
      color: var(--rule);
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 28px;
    }

    .m-rule { height: 1px; background: var(--rule); margin-bottom: 32px; }

    /* ── Redacted document ── */
    #redact-doc {
      flex: 1;
    }

    .r-line {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 5px;
      min-height: 16px;
      margin-bottom: 8px;
    }

    /* Redacted bar (dark rectangle = censored word) */
    .r-bar {
      display: inline-block;
      height: 9px;
      background: var(--bar);
      border-radius: 1px;
      flex-shrink: 0;
    }

    /* Metadata label — small, uppercase, dim */
    .r-lbl {
      font-size: 8px;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--dim);
      white-space: nowrap;
      flex-shrink: 0;
      padding: 2px 5px 1px;
      border: 1px solid var(--rule);
      line-height: 1.2;
    }

    /* Metadata value — readable */
    .r-val {
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Category tag inside redacted block */
    .r-cat {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--ink);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .r-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Spacer pushes nav to bottom */
    .m-spacer { flex: 0 0 32px; }

    /* ── Prev / Next ── */
    #obj-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 22px;
      border-top: 1px solid var(--rule);
    }
    .nav-a {
      font-size: 9px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1px;
      transition: border-color 0.2s;
    }
    .nav-a:hover { border-color: var(--ink); }
    .nav-a.off {
      color: var(--dim);
      pointer-events: none;
      border-color: transparent;
    }
    #obj-pos {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--dim);
    }
  </style>
</head>
<body>

<header>
  <span class="h-title">The Manufactured Face</span>
  <span class="h-spacer"></span>
  <span class="h-label" id="h-id">—</span>
  <span class="h-spacer"></span>
  <span class="h-back"><a href="themanufacturedface.html">Archive ↗</a></span>
</header>

<div id="obj-layout">

  <div id="obj-image">
    <img id="obj-img" src="" alt="">
  </div>

  <div id="obj-meta">
    <div id="obj-num">—</div>
    <div class="m-rule"></div>
    <div id="redact-doc"></div>
    <div class="m-spacer"></div>
    <div id="obj-nav">
      <a id="obj-prev" class="nav-a off" href="#">← Prev</a>
      <span id="obj-pos">— / —</span>
      <a id="obj-next" class="nav-a off" href="#">Next →</a>
    </div>
  </div>

</div>

<script>
const CAT_COLOR = {
  'The Advertisement':    'rgb(185,40,40)',
  'The Borrowed Image':   'rgb(45,75,185)',
  'The Modern Face':      'rgb(175,125,15)',
  'The Professional':     'rgb(25,125,75)',
  'The Traditional Body': 'rgb(120,40,165)',
};

function seq(n, prefix, ext) {
  return Array.from({length: n}, (_, i) => prefix + String(i + 1).padStart(4, '0') + ext);
}

const FOLDER_FILES = {
  'Al-Kawakib':   { dir: 'Al-Kawakib',              files: seq(23,  'kawakib_',  '.jpg')  },
  'Al-Thqafa':    { dir: 'Al-Thqafa',               files: Array.from({length: 9},  (_, i) => `CamScanner 18-05-2026 13.33_${i+1}.JPG`) },
  'Al-Rissalah':  { dir: 'Al-Rissalah',             files: Array.from({length: 36}, (_, i) => `الرسالة_${i+1}.JPG`) },
  'Al-ethnayn':   { dir: 'Al-ethnayn wa Aldonya',   files: seq(36,  'ethnayn_',  '.jpg')  },
  'Al-Mawed':     { dir: 'Al-Mawed',                files: seq(246, 'mawed_',    '.jpg')  },
  'Al-alam':      { dir: 'Al-alam',                 files: seq(144, 'alam_',     '.jpg')  },
  'Al-ethnayn 2': { dir: 'Al-ethnayn wa aldonya 2', files: seq(430, 'ethnayn2_', '.jpeg') },
  'Al-ethnayn 3': { dir: 'Al-ethnayn wa aldonya 3', files: seq(348, 'ethnayn3_', '.jpeg') },
};

// ── Read URL params ───────────────────────────────────────────────────────
const P       = new URLSearchParams(location.search);
const dir     = P.get('dir')     || '';
const file    = P.get('file')    || '';
const mag     = P.get('mag')     || '';
const country = P.get('country') || '';
const catsRaw = P.get('cats')    || '';
const cats    = catsRaw ? catsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

// ── Image ─────────────────────────────────────────────────────────────────
document.getElementById('obj-img').src = dir + '/' + file;
document.getElementById('obj-img').alt = file;

// ── Header & number ───────────────────────────────────────────────────────
document.getElementById('h-id').textContent = file.replace(/\.[^.]+$/, '');

const folder = FOLDER_FILES[mag];
const idx    = folder ? folder.files.indexOf(file) : -1;
const total  = folder ? folder.files.length : 0;

document.getElementById('obj-num').textContent = idx >= 0 ? String(idx + 1).padStart(4, '0') : '—';
document.getElementById('obj-pos').textContent = idx >= 0 ? `${idx + 1} / ${total}` : '— / —';

// ── Build redacted paragraph ──────────────────────────────────────────────
(function buildRedactDoc() {
  const doc = document.getElementById('redact-doc');

  function bar(w) { return { t: 'bar', w }; }
  function lbl(s) { return { t: 'lbl', s }; }
  function val(s) { return { t: 'val', s }; }
  function cat(s) { return { t: 'cat', s, color: CAT_COLOR[s] || '#5a5650' }; }

  // Document lines: mix of redacted bars and visible metadata
  const lines = [
    [bar(48), bar(32), bar(61), bar(19)],
    [bar(26), bar(44), bar(38)],
    [bar(14), lbl('Magazine'), bar(10), val(mag || '—')],
    [bar(72), bar(28), bar(50)],
    [bar(35), bar(18), bar(55), bar(40)],
    [bar(20), lbl('Country'),  bar(14), val(country || '—')],
    [bar(60), bar(45), bar(33)],
    [bar(16), bar(52), bar(29), bar(42)],
    [bar(10), lbl('Category')],
  ];

  if (cats.length) {
    cats.forEach(c => lines.push([bar(18), cat(c), bar(30)]));
  } else {
    lines.push([bar(18), val('—')]);
  }

  lines.push([bar(65), bar(38), bar(24)]);
  lines.push([bar(29), bar(50), bar(18), bar(44)]);
  lines.push([bar(80), bar(35)]);

  lines.forEach(items => {
    const row = document.createElement('div');
    row.className = 'r-line';

    items.forEach(item => {
      if (item.t === 'bar') {
        const el = document.createElement('span');
        el.className = 'r-bar';
        el.style.width = item.w + 'px';
        row.appendChild(el);

      } else if (item.t === 'lbl') {
        const el = document.createElement('span');
        el.className = 'r-lbl';
        el.textContent = item.s;
        row.appendChild(el);

      } else if (item.t === 'val') {
        const el = document.createElement('span');
        el.className = 'r-val';
        el.textContent = item.s;
        row.appendChild(el);

      } else if (item.t === 'cat') {
        const el = document.createElement('span');
        el.className = 'r-cat';
        const dot = document.createElement('span');
        dot.className = 'r-dot';
        dot.style.background = item.color;
        el.appendChild(dot);
        el.appendChild(document.createTextNode(item.s));
        row.appendChild(el);
      }
    });

    doc.appendChild(row);
  });
})();

// ── Prev / Next ───────────────────────────────────────────────────────────
function makeUrl(targetFile) {
  if (!folder) return '#';
  const p = new URLSearchParams({ dir: folder.dir, file: targetFile, mag, country, cats: '' });
  return 'object.html?' + p.toString();
}

const prevEl = document.getElementById('obj-prev');
const nextEl = document.getElementById('obj-next');

if (folder && idx > 0) {
  prevEl.href = makeUrl(folder.files[idx - 1]);
  prevEl.classList.remove('off');
}
if (folder && idx >= 0 && idx < total - 1) {
  nextEl.href = makeUrl(folder.files[idx + 1]);
  nextEl.classList.remove('off');
}

// ── Keyboard navigation ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft'  && !prevEl.classList.contains('off')) location.href = prevEl.href;
  if (e.key === 'ArrowRight' && !nextEl.classList.contains('off')) location.href = nextEl.href;
  if (e.key === 'Escape') location.href = 'themanufacturedface.html';
});
</script>
</body>
</html>
