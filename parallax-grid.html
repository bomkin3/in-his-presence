<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive — Parallax Grid</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      width: 100%; height: 100%;
    }
    body {
      width: 100%;
      min-height: 700vh;
      overflow-y: auto;
      /* Warm archival paper background */
      background: #ece6d4;
    }

    /* Grain texture overlay — CSS only, no external asset */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      opacity: 0.03;
    }

    /* Scene container — images are absolute children */
    #scene {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 700vh;
      overflow: visible;
    }

    /* ── Photo item ── */
    .pi {
      position: absolute;
      will-change: transform;
      cursor: default;
    }

    .pi-frame {
      display: inline-block;
      line-height: 0;
    }

    .pi-frame img {
      display: block;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      filter: sepia(0.10) contrast(0.95) brightness(0.98) saturate(0.9);
    }

    /* Subtle hover lift — purely decorative, no scale-up */
    .pi:hover .pi-frame {
      box-shadow:
        0 2px 4px  rgba(60,40,10,0.13),
        0 8px 22px rgba(60,40,10,0.12),
        0 24px 60px rgba(60,40,10,0.10);
      transition: box-shadow 0.4s ease;
    }

    .pi { cursor: pointer; }

    /* ── Optional: soft custom cursor ── */
    html { cursor: crosshair; }

    /* ── Side panel ── */
    #side-panel {
      position: fixed;
      top: 0; left: 0;
      width: 300px;
      height: 100vh;
      background: #f5f0e6;
      border-right: 1px solid #c8b89a;
      z-index: 3000;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.38s cubic-bezier(0.4,0,0.2,1);
      overflow-y: auto;
      overflow-x: hidden;
    }
    #side-panel.open { transform: translateX(0); }

    #sp-close {
      position: absolute;
      top: 10px; right: 12px;
      background: none; border: none;
      font-size: 18px; color: #5a4a3a;
      cursor: pointer; line-height: 1;
      z-index: 1;
    }
    #sp-close:hover { color: #1a0a00; }

    #sp-main-img {
      width: 100%; height: auto;
      display: block;
      filter: sepia(0.12) contrast(0.94) brightness(0.97);
      border-bottom: 1px solid #c8b89a;
    }

    #sp-info {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #ddd3c0;
    }
    #sp-folder {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9a8a7a;
      margin-bottom: 4px;
    }
    #sp-filename {
      font-family: 'Georgia', serif;
      font-size: 13px;
      color: #3a2a1a;
    }

    #sp-related { padding: 12px 14px 20px; }
    #sp-related h4 {
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9a8a7a;
      margin-bottom: 10px;
    }
    #sp-thumbs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .sp-thumb {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover;
      cursor: pointer;
      filter: sepia(0.12) contrast(0.94);
      border: 1px solid #c8b89a;
      transition: border-color 0.2s, opacity 0.2s;
      display: block;
    }
    .sp-thumb:hover { border-color: #5a4a3a; opacity: 0.85; }

  </style>
</head>
<body>
<div id="scene"></div>

    <div id="sp-filename"></div>

    const filename = src.split('/').pop();

    spFolder.textContent  = folder.replace(/-/g, ' ');
    spFile.textContent    = filename;

    /* Related images from same folder (excluding current) */
    const related = ITEMS.filter(it => it.src !== src && it.src.startsWith(folder + '/'));

    related.forEach(it => {

      img.src       = it.src;
      img.alt       = '';
      img.className = 'sp-thumb';
      img.addEventListener('click', () => openPanel(it.src));
      spThumbs.appendChild(img);
    });

    panel.classList.add('open');
  }

  });

  function placeEl(el, item) {
    el.style.left = `${window.innerWidth  * item.x / 100}px`;
    el.style.top  = `${window.innerHeight * 3 * item.y / 100}px`;
    /* Bake rotation into a data attribute for use in RAF */
    el.dataset.rot = item.rot;
    el.style.transform = `translate3d(0px,0px,0) rotate(${item.rot}deg)`;
  }

  /* ── Mouse tracking ──────────────────────────────── */
  window.addEventListener('mousemove', e => {
    mouseNX = e.clientX / window.innerWidth;
    mouseNY = e.clientY / window.innerHeight;
  }, { passive: true });

  /* On touch devices: mirror touch position */
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    mouseNX = t.clientX / window.innerWidth;
    mouseNY = t.clientY / window.innerHeight;
  }, { passive: true });

  /* ── RAF animation loop ──────────────────────────── */
  function lerp(a, b, t) { return a + (b - a) * t; }

  function tick() {
    /* Offset from center: -0.5 → +0.5 */
    const dx = mouseNX - 0.5;
    const dy = mouseNY - 0.5;

    for (let i = 0; i < ITEMS.length; i++) {
      const d = ITEMS[i].depth;

      /* Target position: inverse of cursor direction × depth scale */
      const tx = -dx * MAX_X * d;
      const ty = -dy * MAX_Y * d;

      /* LERP toward target */
      cur[i].x = lerp(cur[i].x, tx, EASE);
      cur[i].y = lerp(cur[i].y, ty, EASE);

      els[i].style.transform =
        `translate3d(${cur[i].x.toFixed(2)}px,${cur[i].y.toFixed(2)}px,0) ` +
        `rotate(${ITEMS[i].rot}deg)`;
    }

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);

  /* ── Resize handler ──────────────────────────────── */
  window.addEventListener('resize', () => {
    ITEMS.forEach((item, i) => placeEl(els[i], item));
  });

})();
</script>
</body>
</html>
